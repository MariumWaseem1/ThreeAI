services:
  - type: web
    name: signal-newsletter
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: signal-daily-send
    runtime: node
    schedule: "0 9 * * *"
    buildCommand: echo "no build needed"
    startCommand: "curl -s -H \"Authorization: Bearer $CRON_SECRET\" $NEXT_PUBLIC_BASE_URL/api/send-newsletter"
    envVars:
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
